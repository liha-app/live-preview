<!doctype html>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Kaku+Gothic+New:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap"
/>
<style>
  /*
   * The share card, drawn in the same hand as the landing page.
   *
   * It is rendered once by scripts/make-og.mjs and committed as a PNG — the
   * unfurl in Slack or on a timeline is a still, so the sheet, the pen and the
   * handwriting have to survive being baked. Sized for the smallest place it
   * appears rather than the largest: the title carries at thumbnail size, and
   * everything else is allowed to be unreadable there.
   */
  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
  }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background-color: #f7f3e8;
    background-image:
      linear-gradient(rgb(31 79 109 / 7%) 1px, transparent 1px),
      linear-gradient(90deg, rgb(31 79 109 / 7%) 1px, transparent 1px);
    background-size: 34px 34px;
    font-family: 'Zen Kaku Gothic New', system-ui, sans-serif;
    color: #23303a;
    display: flex;
    align-items: center;
    gap: 34px;
    padding: 52px 64px 62px;
  }

  .left {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 11px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 21px;
    color: #3b4853;
  }

  .brand img {
    width: 26px;
    height: 26px;
  }

  h1 {
    font-family: Yomogi, cursive;
    font-weight: 400;
    font-size: 76px;
    line-height: 1.04;
    letter-spacing: 0;
    margin: 0;
  }

  .underline {
    height: 13px;
    width: 560px;
    margin-top: -6px;
    border-radius: 7px;
    transform: rotate(-0.6deg);
    background: linear-gradient(
      90deg,
      rgb(255 206 84 / 25%),
      rgb(255 206 84 / 90%) 30%,
      rgb(255 206 84 / 90%) 72%,
      rgb(255 206 84 / 25%)
    );
  }

  .lede {
    font-size: 25px;
    line-height: 1.5;
    color: #3b4853;
    max-width: 15.5em;
  }

  .pen {
    font-family: Yomogi, cursive;
    font-size: 23px;
    color: #b8352a;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pen::before {
    content: '';
    width: 30px;
    height: 2.5px;
    background: #b8352a;
    border-radius: 2px;
  }

  /* The sketch: the same drawing the landing page makes of itself. */
  .right {
    flex: none;
    width: 404px;
    position: relative;
  }

  .win {
    background: #fffdf7;
    border: 2px solid #2b3a45;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    box-shadow: 9px 9px 0 rgb(43 58 69 / 13%);
    transform: rotate(-1.4deg);
    padding: 0 0 26px;
    overflow: hidden;
  }

  .bar {
    height: 34px;
    border-bottom: 2px solid #2b3a45;
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 13px;
  }

  .bar i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 1.8px solid #2b3a45;
  }

  .lines {
    padding: 24px 26px 0;
    display: flex;
    flex-direction: column;
    gap: 11px;
  }

  .lines b,
  .lines s {
    display: block;
    height: 10px;
    border-radius: 5px;
    background: #eae5d8;
    text-decoration: none;
  }

  .lines b {
    width: 46%;
    height: 15px;
    background: #e6e0d1;
  }

  .cta {
    margin-top: 12px;
    width: 128px;
    height: 36px;
    border: 2.5px solid #b8352a;
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
  }

  .note {
    position: absolute;
    right: -18px;
    bottom: -26px;
    font-family: Yomogi, cursive;
    font-size: 19px;
    line-height: 1.35;
    color: #23303a;
    background: #ffe58a;
    padding: 11px 15px;
    border-radius: 15px 225px 15px 255px / 225px 15px 255px 15px;
    box-shadow: 5px 5px 0 rgb(43 58 69 / 13%);
    transform: rotate(2.4deg);
  }
</style>

<div class="left">
  <div class="brand"><img src="../apps/web/public/liha-mark.svg" alt="" /> liha</div>
  <h1>Liha Live&nbsp;Preview</h1>
  <div class="underline"></div>
  <p class="lede">
    A stable URL for the build. Reviewers point at what they mean, and the agent in the same tab
    acts on it.
  </p>
  <div class="pen">13 WebMCP tools, published by the page</div>
</div>

<div class="right">
  <div class="win">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="lines">
      <b></b>
      <s></s>
      <s style="width: 74%"></s>
      <div class="cta"></div>
    </div>
  </div>
  <div class="note">the agent is<br />in this tab</div>
</div>
