<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Share build artifacts for review, and let AI agents close the feedback loop."
    />
    <!--
      Chrome WebMCP origin trial, so the site publishes its tools in stock
      Chrome without chrome://flags. Two tokens, because the app is served from
      two places: the landing page at https://livepreview.liha.dev, and every
      review screen at https://lp-<slug>.liha.review — the second is registered
      for liha.review with subdomain matching, since each preview is an origin
      of its own. Both valid to 2026-11-17, Chrome 149-156. A token that does
      not match the origin it is read on is ignored, so shipping both
      everywhere is how this is meant to work; tokens are public by design.

      Deploying this repo somewhere else? Register your own origin at
      https://developer.chrome.com/origintrials and replace the token. A wrong
      or expired one is ignored, and the app falls back to reporting WebMCP as
      unavailable in the Agent tools panel.
    -->
    <meta
      http-equiv="origin-trial"
      content="Ao9TYcPWsKjwJyIH3H6hhgC/TO3endPfrZRu1/PilTymNIpO23H6mWkG08QCfl9IclUOxUqhH7LJcMCTEuboWgAAAABUeyJvcmlnaW4iOiJodHRwczovL2xpdmVwcmV2aWV3LmxpaGEuZGV2OjQ0MyIsImZlYXR1cmUiOiJXZWJNQ1AiLCJleHBpcnkiOjE3OTQ4NzM2MDB9"
    />
    <meta
      http-equiv="origin-trial"
      content="AnFCjzOyaJ0bUcFvA0goDmCyUvuUlazjEp3SuggpPxtbQl7JIrESe0UCwdOPYYft+6IJHjgHiwbrfk0OrKY3PQIAAABeeyJvcmlnaW4iOiJodHRwczovL2xpaGEucmV2aWV3OjQ0MyIsImZlYXR1cmUiOiJXZWJNQ1AiLCJleHBpcnkiOjE3OTQ4NzM2MDAsImlzU3ViZG9tYWluIjp0cnVlfQ=="
    />
    <!--
      Yomogi is the handwriting the interface is drawn in; Zen Kaku Gothic New
      and Zen Kurenaido carry Japanese body text and form fields, JetBrains Mono
      the paths and commands. The CSP allows exactly these two Google hosts —
      see scripts/lib/headers.mjs.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Kaku+Gothic+New:wght@400;500&family=Zen+Kurenaido&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!--
      The mark is the red pen ring the whole product is about. It fills in and
      carries a number when something arrived while you were away; see
      src/lib/tabBadge.ts, which must keep drawing the same ring.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%2211%22%20fill%3D%22none%22%20stroke%3D%22%23e5484d%22%20stroke-width%3D%223.5%22%2F%3E%3C%2Fsvg%3E"
    />
    <title>Liha Live Preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
