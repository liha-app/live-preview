<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="A stable URL for the build. Reviewers point at what they mean, and the agent in the same tab acts on it through WebMCP."
    />
    <!--
      The share card. Absolute URLs, because an unfurl is fetched by a server
      that has no page to resolve a relative path against.

      This document is also served on every review host, so `og:url` names the
      landing page rather than whatever origin it was read on. That is
      deliberate: a review link pasted into Slack should unfurl as the product,
      not as a preview of somebody's unreleased build.

      Regenerate the image with `node scripts/make-og.mjs` after editing
      scripts/og-card.html.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Liha Live Preview" />
    <meta property="og:url" content="https://livepreview.liha.dev/" />
    <meta property="og:title" content="Liha Live Preview" />
    <meta
      property="og:description"
      content="A stable URL for the build. Reviewers point at what they mean, and the agent in the same tab acts on it. through WebMCP."
    />
    <meta property="og:image" content="https://livepreview.liha.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A sheet of graph paper: Liha Live Preview in handwriting, a sketched browser window with one button circled in red pen, and a sticky note reading the agent is in this tab."
    />
    <!-- Title, description and image are taken from the og: tags above. -->
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Chrome WebMCP origin trial, so the site publishes its tools in stock
      Chrome without chrome://flags. Two tokens, because the app is served from
      two places: the landing page at https://livepreview.liha.dev, and every
      review screen at https://lp-<slug>.liha.review — the second is registered
      for liha.review with subdomain matching, since each preview is an origin
      of its own. Both valid to 2026-11-17, Chrome 149-156. A token that does
      not match the origin it is read on is ignored, so shipping both
      everywhere is how this is meant to work; tokens are public by design.

      Deploying this repo somewhere else? Register your own origin at
      https://developer.chrome.com/origintrials and replace the token. A wrong
      or expired one is ignored, and the app falls back to reporting WebMCP as
      unavailable in the Agent tools panel.
    -->
    <meta
      http-equiv="origin-trial"
      content="Ao9TYcPWsKjwJyIH3H6hhgC/TO3endPfrZRu1/PilTymNIpO23H6mWkG08QCfl9IclUOxUqhH7LJcMCTEuboWgAAAABUeyJvcmlnaW4iOiJodHRwczovL2xpdmVwcmV2aWV3LmxpaGEuZGV2OjQ0MyIsImZlYXR1cmUiOiJXZWJNQ1AiLCJleHBpcnkiOjE3OTQ4NzM2MDB9"
    />
    <meta
      http-equiv="origin-trial"
      content="AnFCjzOyaJ0bUcFvA0goDmCyUvuUlazjEp3SuggpPxtbQl7JIrESe0UCwdOPYYft+6IJHjgHiwbrfk0OrKY3PQIAAABeeyJvcmlnaW4iOiJodHRwczovL2xpaGEucmV2aWV3OjQ0MyIsImZlYXR1cmUiOiJXZWJNQ1AiLCJleHBpcnkiOjE3OTQ4NzM2MDAsImlzU3ViZG9tYWluIjp0cnVlfQ=="
    />
    <!--
      Yomogi is the handwriting the interface is drawn in; Zen Kaku Gothic New
      and Zen Kurenaido carry Japanese body text and form fields, JetBrains Mono
      the paths and commands. The CSP allows exactly these two Google hosts —
      see scripts/lib/headers.mjs.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Kaku+Gothic+New:wght@400;500&family=Zen+Kurenaido&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <!--
      The mark, as a file so it lives in one place. src/lib/tabBadge.ts points
      at this same path and swaps in a counted badge when something arrived
      while you were away; a test fails if the two ever disagree.
    -->
    <link rel="icon" type="image/svg+xml" href="/liha-mark.svg" />
    <title>Liha Live Preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
