name = "liha-live-preview"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8787
ip = "127.0.0.1"

# Local development uses wildcard `*.localhost` hostnames so each preview version
# is served from its own origin, exactly as in production.
[vars]
APP_ORIGIN = "http://localhost:5173"
CONTENT_ORIGIN_TEMPLATE = "http://{label}.localhost:8787"
MAX_VERSION_BYTES = "31457280"
# Notifications, locally. `localhost` is a secure context, so service workers
# and push registration work here the same way they do in production.
#
# This keypair is a throwaway committed on purpose so `pnpm dev` has a working
# notification flow out of the box. It is NOT the one production uses: the
# deploy script generates a fresh pair and stores the private half as a Worker
# secret, and the Worker warns loudly if it ever sees this one deployed.
NOTIFICATION_ORIGIN = "http://notification.localhost:8787"
VAPID_PUBLIC_KEY = "BGEpyIoPOQ31k9pUsOlL3sctXBT6DS46M5EeqBnauw1idMhVxtz7D9mx2WPhtqO5iHY8BH3P0N8XE3CBEFBaE7E"
VAPID_PRIVATE_KEY = '{"key_ops":["sign"],"ext":true,"kty":"EC","x":"YSnIig85DfWT2lSw6Uvexy1cFPoNLjozkR6oGdq7DWI","y":"dMhVxtz7D9mx2WPhtqO5iHY8BH3P0N8XE3CBEFBaE7E","crv":"P-256","d":"xvHO2HqN2IkNvpl_w6lNMhPUi078Io94Ha7P-JsB414"}'

# Google sign-in, locally.
#
# These are NOT a real client — they exist so the sign-in path is present in
# development and can be exercised by the tests. Following it as far as Google
# will fail, which is the honest outcome for a made-up client. To sign in for
# real locally, put your own in .dev.vars (which is not committed):
#
#   GOOGLE_CLIENT_ID = "…apps.googleusercontent.com"
#   GOOGLE_CLIENT_SECRET = "…"
#
# The deploy script never copies these: it takes the id from GOOGLE_CLIENT_ID
# and the secret from a file in your home directory.
GOOGLE_CLIENT_ID = "development-only.apps.googleusercontent.com"
GOOGLE_CLIENT_SECRET = "development-only-not-a-real-secret"

[[d1_databases]]
binding = "DB"
database_name = "liha-live-preview"
database_id = "local-dev-placeholder"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "liha-live-preview"

# Samples expire after a day; uploads never do. Hourly, off the hour, because
# that is when everyone else's cron jobs are not running. `wrangler dev` does
# not fire these on its own — POST to /cdn-cgi/handler/scheduled to try it.
[triggers]
crons = ["19 * * * *"]

# Production deployments should set CONTENT_SIGNING_KEY as a secret:
#   wrangler secret put CONTENT_SIGNING_KEY
# and point CONTENT_ORIGIN_TEMPLATE at a wildcard subdomain you control:
#   CONTENT_ORIGIN_TEMPLATE = "https://{label}.preview.example.com"
